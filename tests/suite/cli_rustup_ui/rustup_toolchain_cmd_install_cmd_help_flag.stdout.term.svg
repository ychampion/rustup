<svg xmlns="http://www.w3.org/2000/svg" width="860" height="614"><style>.fg{fill:#aaa}.bg{fill:#000}.fg-bright-cyan{fill:#5ff}.fg-bright-green{fill:#5f5}.fg-cyan{fill:#0aa}.container{padding:0 10px;line-height:18px}.bold{font-weight:700}tspan{font:14px SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;white-space:pre;line-height:18px}</style><rect width="100%" height="100%" y="0" class="bg" rx="4.5"/><text class="container fg" xml:space="preserve"><tspan x="10" y="28"><tspan>Install or update the given toolchains, or by default the active toolchain</tspan> </tspan> <tspan x="10" y="46"> </tspan> <tspan x="10" y="64"><tspan class="fg-bright-green bold">Usage:</tspan><tspan> </tspan><tspan class="fg-bright-cyan bold">rustup[EXE] toolchain install</tspan><tspan> </tspan><tspan class="fg-cyan">[OPTIONS]</tspan><tspan> </tspan><tspan class="fg-cyan">[TOOLCHAIN]...</tspan> </tspan> <tspan x="10" y="82"> </tspan> <tspan x="10" y="100"><tspan class="fg-bright-green bold">Arguments:</tspan> </tspan> <tspan x="10" y="118"><tspan> </tspan><tspan class="fg-cyan">[TOOLCHAIN]...</tspan><tspan> Toolchain name, such as &apos;stable&apos;, &apos;nightly&apos;, or &apos;1.8.0&apos;. For more information see</tspan> </tspan> <tspan x="10" y="136"><tspan> `rustup help toolchain`</tspan> </tspan> <tspan x="10" y="154"> </tspan> <tspan x="10" y="172"><tspan class="fg-bright-green bold">Options:</tspan> </tspan> <tspan x="10" y="190"><tspan> </tspan><tspan class="fg-bright-cyan bold">--profile</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;PROFILE&gt;</tspan><tspan> [possible values: minimal, default, complete]</tspan> </tspan> <tspan x="10" y="208"><tspan> </tspan><tspan class="fg-bright-cyan bold">-c</tspan><tspan>, </tspan><tspan class="fg-bright-cyan bold">--component</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;COMPONENT&gt;</tspan><tspan> Comma-separated list of components to be added on installation</tspan> </tspan> <tspan x="10" y="226"><tspan> </tspan><tspan class="fg-bright-cyan bold">-t</tspan><tspan>, </tspan><tspan class="fg-bright-cyan bold">--target</tspan><tspan class="fg-cyan"> </tspan><tspan class="fg-cyan">&lt;TARGET&gt;</tspan><tspan> Comma-separated list of targets to be added on installation</tspan> </tspan> <tspan x="10" y="244"><tspan> </tspan><tspan class="fg-bright-cyan bold">--no-self-update</tspan><tspan> Don&apos;t perform self update when running the `rustup toolchain install`</tspan> </tspan> <tspan x="10" y="262"><tspan> command</tspan> </tspan> <tspan x="10" y="280"><tspan> </tspan><tspan class="fg-bright-cyan bold">--no-update</tspan><tspan> Don&apos;t try to update the installed toolchain</tspan> </tspan> <tspan x="10" y="298"><tspan> </tspan><tspan class="fg-bright-cyan bold">--force</tspan><tspan> Force an update, even if some components are missing</tspan> </tspan> <tspan x="10" y="316"><tspan> </tspan><tspan class="fg-bright-cyan bold">--allow-downgrade</tspan><tspan> Allow rustup to downgrade the toolchain to satisfy your component</tspan> </tspan> <tspan x="10" y="334"><tspan> choice</tspan> </tspan> <tspan x="10" y="352"><tspan> </tspan><tspan class="fg-bright-cyan bold">--force-non-host</tspan><tspan> Install toolchains that require an emulator. See</tspan> </tspan> <tspan x="10" y="370"><tspan> https://github.com/rust-lang/rustup/wiki/Non-host-toolchains</tspan> </tspan> <tspan x="10" y="388"><tspan> </tspan><tspan class="fg-bright-cyan bold">--override</tspan><tspan> Set the installed toolchain as the override for the current directory</tspan> </tspan> <tspan x="10" y="406"><tspan> </tspan><tspan class="fg-bright-cyan bold">-h</tspan><tspan>, </tspan><tspan class="fg-bright-cyan bold">--help</tspan><tspan> Print help</tspan> </tspan> <tspan x="10" y="424"> </tspan> <tspan x="10" y="442"><tspan class="fg-bright-green bold">Discussion:</tspan> </tspan> <tspan x="10" y="460"><tspan> Some environment variables allow you to customize certain parameters</tspan> </tspan> <tspan x="10" y="478"><tspan> in toolchain installation, including:</tspan> </tspan> <tspan x="10" y="496"> </tspan> <tspan x="10" y="514"><tspan> - `RUSTUP_CONCURRENT_DOWNLOADS`: the number of concurrent downloads.</tspan> </tspan> <tspan x="10" y="532"><tspan> - `RUSTUP_DOWNLOAD_TIMEOUT`: the download timeout in seconds.</tspan> </tspan> <tspan x="10" y="550"> </tspan> <tspan x="10" y="568"><tspan> See &lt;https://rust-lang.github.io/rustup/devel/environment-variables.html&gt;</tspan> </tspan> <tspan x="10" y="586"><tspan> for more info.</tspan></tspan></text></svg>